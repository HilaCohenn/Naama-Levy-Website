<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Naama Levy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>

  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <section class="contact-page">
    <!-- Back bar בתוך הזרימה, דביק ולא חופף -->
    <div class="back-bar">
      <a href="https://hilacohenn.github.io/Naama-Levy-Website/" class="back-button" aria-label="Back to Home">
        ← Back to Home
      </a>
    </div>

    <div class="contact-content">
      <div class="contact-text">
        <h1>Contact</h1>
        <p>Want to collaborate on your next film or creative project?</p>

        <!-- IMPORTANT: add name attributes + enctype -->
        <form action="https://formspree.io/f/xjkaenrr" method="POST" accept-charset="UTF-8" enctype="application/x-www-form-urlencoded">
          <label>Name</label>
          <input type="text" name="name" placeholder="Your name" autocomplete="name" required>

          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>

          <label>Message</label>
          <textarea name="message" placeholder="Tell me about your project..." required></textarea>

          <!-- Optional: redirect to a thank-you page after submit -->
          <!-- <input type="hidden" name="_redirect" value="https://your-domain.com/thank-you.html"> -->

          <button type="submit" class="btn">Send Message</button>
        </form>

        <footer>
          <p>Email: <a href="mailto:naamawork4114@gmail.com">naamawork4114@gmail.com</a></p>
          <p>
            <a href="https://www.instagram.com/namamusic_?igsh=MWhwdDU5dHJ2b3I1bw==" rel="noopener">Instagram</a> |
            <a href="https://on.soundcloud.com/EIhRfGjLY3IXzKRMdm" rel="noopener">SoundCloud</a> |
            <a href="https://open.spotify.com/artist/6xqLxU0YkHFfTt0q7gUsb3?si=ycbpFoM0QKawZ-4SWGgIuQ" rel="noopener">Spotify</a>
          </p>
        </footer>
      </div>

      <div class="contact-image">
        <img src="Contact.jpg" alt="Naama Levy working in studio"/>
      </div>
    </div>
  </section>
</body>
</html>
